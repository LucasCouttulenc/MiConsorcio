{% load static %}
<div class="portal-notificaciones" data-notificaciones>
    <button class="portal-notificaciones-boton" type="button" aria-label="{% if notificaciones_propietario_total %}Ver notificaciones nuevas{% else %}Ver notificaciones{% endif %}" aria-expanded="false" aria-controls="panel-notificaciones" data-notificaciones-toggle>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
        </svg>
        {% if notificaciones_propietario_total %}
            <span class="portal-notificaciones-punto" aria-hidden="true"></span>
            <span class="portal-sr-only">{{ notificaciones_propietario_total }} notificaciones nuevas</span>
        {% endif %}
    </button>
    <div class="portal-notificaciones-panel" id="panel-notificaciones" data-notificaciones-panel hidden>
        <div class="portal-notificaciones-cabecera">
            <strong>Novedades</strong>
            {% if notificaciones_propietario_total %}<span>{{ notificaciones_propietario_total }}</span>{% endif %}
        </div>
        <div class="portal-notificaciones-lista">
        {% for novedad in notificaciones_propietario %}
            {% include "componentes/novedad.html" %}
        {% empty %}
            <p class="portal-notificaciones-vacias">No hay notificaciones nuevas.</p>
        {% endfor %}
        </div>
    </div>
</div>
<script src="{% static 'js/notificaciones_propietario.js' %}" defer></script>
